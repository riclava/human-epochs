services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: human_epochs
      POSTGRES_PASSWORD: human_epochs_local
      POSTGRES_DB: human_epochs
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U human_epochs -d human_epochs"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
