name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: human_epochs
          POSTGRES_PASSWORD: human_epochs_ci
          POSTGRES_DB: human_epochs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U human_epochs -d human_epochs"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Tests create and drop their own databases, so the role owns the server.
      DATABASE_URL: postgresql://human_epochs:human_epochs_ci@127.0.0.1:5432/human_epochs
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
